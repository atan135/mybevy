[package]
name = "project"
version = "0.1.0"
edition = "2024"
default-run = "project"

[workspace]
members = ["crates/audio-core", "crates/myserver-protocol", "crates/network-types"]
default-members = ["."]
exclude = ["vendor/myserver/authority-core", "vendor/myserver/sim-core"]
resolver = "3"

[features]
default = []
ui-document-preview-tool = []

[lib]
name = "project"
crate-type = ["rlib"]

[[bin]]
name = "ui-document-preview"
path = "src/bin/ui_document_preview.rs"
required-features = ["ui-document-preview-tool"]

[[bin]]
name = "ui-update-publish"
path = "src/bin/ui_update_publish.rs"

[dependencies]
audio-core = { path = "crates/audio-core" }
accesskit = "0.21.1"
bevy = { version = "0.18.1", features = ["wav"] }
authority-core = { path = "vendor/myserver/authority-core" }
csv = "1"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
futures-util = "0.3"
myserver-protocol = { path = "crates/myserver-protocol" }
network-types = { path = "crates/network-types" }
prost = "0.14"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
ron = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-core = { path = "vendor/myserver/sim-core" }
tokio = { version = "1.37", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio_kcp = "0.9.8"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.2"
ui-document-core = { path = "../tools/ui-document-core" }

[dev-dependencies]
schemars = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.6"

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev-fast.package."*"]
opt-level = 1

[profile.perf]
inherits = "release"
opt-level = 3
debug = false
incremental = false

[profile.release]
incremental = false
