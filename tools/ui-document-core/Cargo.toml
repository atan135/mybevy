[package]
name = "ui-document-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
schemars = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev-fast.package."*"]
opt-level = 1

[profile.release]
incremental = false
